# Kiln example configuration

[server]
listen = "0.0.0.0:8080"
public_base_url = "http://127.0.0.1:8080"
data_dir = "./data"
# auto treats configured values as ceilings and scales them only when the
# effective container/host limit is below 4 CPUs or about 3.5 GiB. Fractional
# quotas and nested cgroup limits are retained. A nominal 4 GB / 4-core host
# keeps the existing fast path. performance disables all adaptation;
# constrained forces the reproducible 1 CPU / 1 GiB profile.
resource_mode = "auto"
read_timeout_sec = 15
idle_timeout_sec = 120
# Go's soft memory limit. Without it the runtime keeps freed pages mapped, so
# resident memory tracks the peak rather than what is live. Soft: the process is
# never killed for exceeding it. 0 leaves the runtime default.
#
# It has to sit above packager.inflight_bytes, which is live heap: setting it
# below the in-flight budget only makes the collector run harder against memory
# it cannot reclaim. Resident memory lands at roughly inflight_bytes + 60 MB.
memory_limit_mb = 256

[logging]
level = "info"       # debug | info | warn | error
format = "text"      # text (console) | json
color = "auto"       # auto | always | never

[auth]
# Ed25519 keys: omit to auto-create {data_dir}/auth/ed25519.pem on first start.
# token_private_key_file = "/etc/kiln/ed25519.pem"
# token_public_key_file = "/etc/kiln/ed25519.pub.pem"
token_ttl_hours = 24
login_rate_per_min = 20
token_issuer = "kiln"
token_audience = "kiln"

[[auth.users]]
username = "admin"
# bcrypt hash for password "admin" — change before production use
# generate: go run scripts/hash-password.go 'your-password'
password_hash = "$2a$10$8JxhvnpdTX/TrOTi1XaYWuPlrZK1aw3ANgGIWpTO6KtD2M432w7Ie"
role = "admin"

[security]
play_require_auth = true
allowed_hosts = []
# cors_origins = ["http://127.0.0.1:5173"]
# public_hosts = ["kiln.lan", "origin.example.com", "localhost"]
max_playlist_bytes = 8388608
max_body_bytes = 1048576

[packager]
# auto  = native fast path when the source supports it, ffmpeg otherwise
# native = native only; an unsupported source fails instead of falling back
# ffmpeg = always ffmpeg
engine = "auto"
playlist_size = 8
# Enables CMAF parts, delta playlists, and blocking reload for native DASH.
ll_hls = true
part_target_ms = 500
start_segments = 3
prefetch_segments = 3
max_segment_bytes = 33554432
grace_sec = 30
# Segment bytes held in memory across all channels at once. This is what decides
# peak memory: a 4K segment is tens of megabytes, so a limit counted in segments
# instead of bytes would make memory a function of the source's bitrate.
#
# It buys cold-start latency, and nothing else: in steady state each track pulls
# one segment per refresh and never comes close to the budget. Measured on a 4K
# and a 1080p channel at once, both with multiple audio renditions:
#
#   96 MB (default)  resident 140-170 MB, 4K first playlist in ~8.6 s
#   32 MB            resident 106-112 MB, 4K first playlist in ~11 s
#
# So: lower it if resident memory matters more than how fast a 4K channel starts.
inflight_bytes = 100663296
# How far, in media seconds, audio may run ahead of video. Not an A/V sync knob:
# it stops audio from sliding its playlist window past what a player stalled on
# video still needs.
primary_track_hold_sec = 12
# Fail a publication whose manifest keeps updating while nothing reaches the
# playlist: at that point the fault is ours, and a restart re-plans from scratch.
# An unreachable upstream is not this case and keeps retrying. -1 disables.
stall_timeout_sec = 180

[ffmpeg]
mode = "native"       # native | docker
binary = "ffmpeg"
# docker_image = "kiln:local"  # used only when mode = "docker"
hls_time = 2
hls_list_size = 4
log_level = "error"
prefer_height = 1080
low_latency = true
# Bounds concurrent ffmpeg launches. It does not cover the readiness wait, so a
# slow source no longer blocks every other channel's cold start.
max_starts = 1

[observe]
enabled = true
# otlp_endpoint = "http://127.0.0.1:4318"
# otlp_insecure = true
# trace_sample_ratio = 0.1

[debug.pprof]
# Enable temporarily while collecting CPU, heap, block, or mutex profiles.
# The listener must use a loopback IP and is never exposed by the public server.
enabled = false
listen = "127.0.0.1:6060"

[epg]
enabled = false
cache = true
cache_dir = "./data/epg"
refresh_interval_min = 360
# 0 refreshes every source in parallel on normal hosts. In auto mode both zero
# and unsafe positive values are capped from effective CPU and memory limits.
max_refresh_concurrency = 0
max_source_bytes = 67108864
default_timezone = "Asia/Hong_Kong"
serve_timezone = "keep"

# Optional outbound proxies
# [[proxies]]
# id = "local-http"
# name = "HTTP Proxy"
# url = "http://127.0.0.1:7890"

# [[proxies]]
# id = "proxy-socks"
# url = "socks5h://127.0.0.1:7891"

[egress]
default = "direct"
playlist_policy = "rewrite"
# docker_proxy_host = "host.docker.internal"

# [[egress.rules]]
# id = "example-cdn"
# priority = 10
# kind = "host_suffix"
# pattern = "example-cdn.com"
# proxy = "local-http"

[[upstreams]]
id = "origin"
base_url = "http://127.0.0.1:5050"
# [upstreams.headers]
# X-Custom = "value"

[[channels]]
id = "hls-demo"
title = "Demo HLS"
group = "Demo"
upstream = "origin"
path = "/live/demo-hls"
ingress = "hls"
on_demand = true
autostart = false

[[channels]]
id = "dash-demo"
title = "Demo DASH"
group = "Demo"
upstream = "origin"
path = "/live/demo-dash"
ingress = "dash"
keys_file = "keys.example.txt"
prefer_height = 1080
preferred_audio_languages = ["yue", "zh", "en"]
on_demand = true
