# Kiln example configuration

[server]
listen = "0.0.0.0:8080"
public_base_url = "http://127.0.0.1:8080"
data_dir = "./data"
read_timeout_sec = 15
idle_timeout_sec = 120

[logging]
level = "info"       # debug | info | warn | error
format = "text"      # text (console) | json
color = "auto"       # auto | always | never

[auth]
# Ed25519 keys: omit to auto-create {data_dir}/auth/ed25519.pem on first start.
# token_private_key_file = "/etc/kiln/ed25519.pem"
# token_public_key_file = "/etc/kiln/ed25519.pub.pem"
token_ttl_hours = 24
login_rate_per_min = 20
token_issuer = "kiln"
token_audience = "kiln"

[[auth.users]]
username = "admin"
# Argon2id hash for password "admin" — change before production use
# generate: go run scripts/hash-password.go 'your-password'
password_hash = "$argon2id$v=19$m=65536,t=2,p=1$NoPZL19JasDMzCoAHW94PA$K9rCvuXYHSevXNZyI+1BbsIY6ZulUOl9iVFJ6ebfx+A"
role = "admin"

[security]
play_require_auth = true
allowed_hosts = []
# cors_origins = ["http://127.0.0.1:5173"]
# public_hosts = ["kiln.lan", "origin.example.com", "localhost"]
max_playlist_bytes = 8388608
max_body_bytes = 1048576

[ffmpeg]
binary = "ffmpeg"
hls_time = 2
hls_list_size = 4
log_level = "error"
prefer_height = 1080
low_latency = true

[observe]
enabled = true

# Optional outbound proxies
# [[proxies]]
# id = "local-http"
# name = "HTTP Proxy"
# url = "http://127.0.0.1:7890"

# [[proxies]]
# id = "proxy-socks"
# url = "socks5h://127.0.0.1:7891"

[egress]
default = "direct"
playlist_policy = "rewrite"
# docker_proxy_host = "host.docker.internal"

# [[egress.rules]]
# id = "example-cdn"
# priority = 10
# kind = "host_suffix"
# pattern = "example-cdn.com"
# proxy = "local-http"

[[upstreams]]
id = "origin"
base_url = "http://127.0.0.1:5050"
# [upstreams.headers]
# X-Custom = "value"

[[channels]]
id = "hls-demo"
title = "Demo HLS"
group = "Demo"
upstream = "origin"
path = "/live/demo-hls"
ingress = "hls"
on_demand = true
autostart = false

[[channels]]
id = "dash-demo"
title = "Demo DASH"
group = "Demo"
upstream = "origin"
path = "/live/demo-dash"
ingress = "dash"
keys_file = "keys.example.txt"
prefer_height = 1080
on_demand = true
