# Production-style full image.
# Change target to core and image to kiln:core for a native-only deployment.
# Copy and adjust paths; do not commit real secrets.

services:
  kiln:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
      target: full
    image: kiln:local
    container_name: kiln
    ports:
      - "8080:8080"
    # Optional environment:
    # environment:
    #   KILN_TOKEN_PRIVATE_KEY_FILE: /etc/kiln/ed25519.pem
    #   KILN_PUBLIC_BASE_URL: "http://your-host:8080"
    #   KILN_LOG_LEVEL: "info"
    #   KILN_LOG_FORMAT: "text"
    #   KILN_LOG_COLOR: "never"
    # Lets a proxy route use http://host.docker.internal:PORT to reach the host.
    # Provided automatically by Docker Desktop; required on Linux.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./kiln.toml:/etc/kiln/kiln.toml:ro
      - ./kiln.keys:/etc/kiln/kiln.keys:ro
      # - ./ed25519.pem:/etc/kiln/ed25519.pem:ro
      - kiln-data:/var/lib/kiln/data
    restart: unless-stopped
    # If origin is another docker service on the same network, set base_url to
    # http://service-name:port and attach both to the same network. A proxy
    # running as a sibling container is addressed the same way.

volumes:
  kiln-data:
