name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  go:
    name: Quality / Go
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install lint/vuln tools
        run: |
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.12.2
          go install golang.org/x/vuln/cmd/govulncheck@v1.6.0
      - run: make fmt
      - run: make vet
      - run: make lint
      - run: make build
      - name: Test with media oracle
        env:
          KILN_REQUIRE_MEDIA_ORACLE: "1"
        run: make test
      - name: Run safety fuzzers
        run: make test-safety
      - name: Record performance benchmarks
        run: |
          set -o pipefail
          make benchmark-performance | tee benchmarks.txt
      - name: Upload performance benchmarks
        uses: actions/upload-artifact@v6
        with:
          name: packager-benchmarks
          path: benchmarks.txt
      - run: make vuln

  docker:
    name: Build / Container
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - name: Build amd64 (runs capability + CENC assertions inside the build)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/docker/Dockerfile
          platforms: linux/amd64
          load: true
          tags: kiln:ci-amd64
          build-args: |
            VERSION=ci
            COMMIT=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build arm64 (runs the same assertions under emulation)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/docker/Dockerfile
          platforms: linux/arm64
          outputs: type=cacheonly
          build-args: |
            VERSION=ci
            COMMIT=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke the remote (HTTP origin) path
        run: |
          docker network create kilnsmoke
          docker run -d --name kiln-origin --network kilnsmoke \
            -v "$PWD/testdata/cenc:/www:ro" busybox:1.36 httpd -f -p 8000 -h /www
          docker run --rm --network kilnsmoke \
            -e ORIGIN_URL=http://kiln-origin:8000 \
            -v "$PWD:/src:ro" -w /src \
            --entrypoint /bin/sh kiln:ci-amd64 \
            deploy/docker/smoke.sh /usr/local/bin/ffmpeg testdata/cenc

      - name: Report image size
        run: docker images --format '{{.Repository}}:{{.Tag}} {{.Size}}' kiln:ci-amd64
