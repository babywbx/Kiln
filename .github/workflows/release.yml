name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to release
        required: true

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  BUSYBOX_IMAGE: busybox:1.38.0@sha256:fd8d9aa63ba2f0982b5304e1ee8d3b90a210bc1ffb5314d980eb6962f1a9715d

jobs:
  guard:
    name: Guard / Verify Tagged Tree
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.identity.outputs.tag }}
      sha: ${{ steps.commit.outputs.sha }}
      version: ${{ steps.identity.outputs.version }}
      prerelease: ${{ steps.identity.outputs.prerelease }}
      built_at: ${{ steps.identity.outputs.built_at }}
    steps:
      - name: Resolve Release Identity
        id: identity
        env:
          RAW_TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          if ! printf '%s' "$RAW_TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$'; then
            echo "refusing to release from an unexpected tag" >&2
            exit 1
          fi
          version="${RAW_TAG#v}"
          case "$version" in
            *-*) prerelease=true ;;
            *) prerelease=false ;;
          esac
          {
            echo "tag=$RAW_TAG"
            echo "version=$version"
            echo "prerelease=$prerelease"
            echo "built_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } >> "$GITHUB_OUTPUT"

      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.identity.outputs.tag }}

      - name: Pin Commit Under Test
        id: commit
        run: |
          set -euo pipefail
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Check Formatting
        run: make fmt

      - name: Vet Sources
        run: make vet

      - name: Run Tests
        run: make test

      - name: Run Lite Tests
        run: make test-lite

  images:
    name: Publish / Container Images
    runs-on: ubuntu-latest
    needs: guard
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.guard.outputs.sha }}

      - name: Setup QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0

      - name: Setup Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Resolve Image Tags
        id: tags
        env:
          VERSION: ${{ needs.guard.outputs.version }}
          PRERELEASE: ${{ needs.guard.outputs.prerelease }}
        run: |
          set -euo pipefail
          base="${REGISTRY}/$(printf '%s' "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')"
          major="${VERSION%%.*}"
          rest="${VERSION#*.}"
          minor="${rest%%.*}"
          emit() {
            variant="$1"
            suffix=""
            [ "$variant" != "full" ] && suffix="-$variant"
            list="${base}:${VERSION}${suffix}"
            if [ "$PRERELEASE" = "false" ]; then
              list="${list},${base}:${major}.${minor}${suffix}"
              list="${list},${base}:${major}${suffix}"
              if [ "$variant" = "full" ]; then
                list="${list},${base}:latest"
              else
                list="${list},${base}:${variant}"
              fi
            fi
            echo "${variant}=${list}" >> "$GITHUB_OUTPUT"
          }
          emit full
          emit core
          emit lite
          echo "base=$base" >> "$GITHUB_OUTPUT"

      - name: Build Core Image (amd64)
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: deploy/docker/Dockerfile
          target: core
          platforms: linux/amd64
          load: true
          tags: kiln:release-core-amd64
          build-args: |
            VERSION=${{ needs.guard.outputs.version }}
            COMMIT=${{ needs.guard.outputs.sha }}
            BUILT_AT=${{ needs.guard.outputs.built_at }}
          cache-from: type=gha,scope=core-amd64
          cache-to: type=gha,mode=max,scope=core-amd64

      - name: Build Full Image (amd64)
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: deploy/docker/Dockerfile
          target: full
          platforms: linux/amd64
          load: true
          tags: kiln:release-full-amd64
          build-args: |
            VERSION=${{ needs.guard.outputs.version }}
            COMMIT=${{ needs.guard.outputs.sha }}
            BUILT_AT=${{ needs.guard.outputs.built_at }}
          cache-from: type=gha,scope=full-amd64
          cache-to: type=gha,mode=max,scope=full-amd64

      - name: Build Lite Image (amd64)
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: deploy/docker/Dockerfile
          target: lite
          platforms: linux/amd64
          load: true
          tags: kiln:release-lite-amd64
          build-args: |
            VERSION=${{ needs.guard.outputs.version }}
            COMMIT=${{ needs.guard.outputs.sha }}
            BUILT_AT=${{ needs.guard.outputs.built_at }}
          cache-from: type=gha,scope=lite-amd64
          cache-to: type=gha,mode=max,scope=lite-amd64

      - name: Verify Core and Full Image Contracts
        run: deploy/docker/verify-images.sh kiln:release-core-amd64 kiln:release-full-amd64

      - name: Verify Lite Image Contract
        run: deploy/docker/verify-lite.sh kiln:release-lite-amd64

      - name: Verify Full Image Constrained-Memory Advisory
        run: deploy/docker/full-resource-smoke.sh kiln:release-full-amd64

      - name: Smoke Test Core Compact Media Path
        run: deploy/docker/core-media-smoke.sh kiln:release-core-amd64 "$BUSYBOX_IMAGE"

      - name: Smoke Test Lite Native Media Runtime
        run: deploy/docker/native-media-runtime-smoke.sh kiln:release-lite-amd64 "$BUSYBOX_IMAGE"

      - name: Log In To Registry
        env:
          REGISTRY_USER: ${{ github.actor }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          printf '%s' "$REGISTRY_TOKEN" \
            | docker login "$REGISTRY" -u "$REGISTRY_USER" --password-stdin

      - name: Push Core Image
        id: push-core
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: deploy/docker/Dockerfile
          target: core
          platforms: linux/amd64,linux/arm64,linux/arm/v7,linux/arm/v6
          push: true
          tags: ${{ steps.tags.outputs.core }}
          build-args: |
            VERSION=${{ needs.guard.outputs.version }}
            COMMIT=${{ needs.guard.outputs.sha }}
            BUILT_AT=${{ needs.guard.outputs.built_at }}
          cache-from: type=gha,scope=core-release
          cache-to: type=gha,mode=max,scope=core-release

      - name: Attest Core Image Provenance
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-name: ${{ steps.tags.outputs.base }}
          subject-digest: ${{ steps.push-core.outputs.digest }}
          push-to-registry: true

      - name: Push Full Image
        id: push-full
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: deploy/docker/Dockerfile
          target: full
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.full }}
          build-args: |
            VERSION=${{ needs.guard.outputs.version }}
            COMMIT=${{ needs.guard.outputs.sha }}
            BUILT_AT=${{ needs.guard.outputs.built_at }}
          cache-from: type=gha,scope=full-release
          cache-to: type=gha,mode=max,scope=full-release

      - name: Attest Full Image Provenance
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-name: ${{ steps.tags.outputs.base }}
          subject-digest: ${{ steps.push-full.outputs.digest }}
          push-to-registry: true

      - name: Push Lite Image
        id: push-lite
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: deploy/docker/Dockerfile
          target: lite
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.lite }}
          build-args: |
            VERSION=${{ needs.guard.outputs.version }}
            COMMIT=${{ needs.guard.outputs.sha }}
            BUILT_AT=${{ needs.guard.outputs.built_at }}
          cache-from: type=gha,scope=lite-release
          cache-to: type=gha,mode=max,scope=lite-release

      - name: Attest Lite Image Provenance
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-name: ${{ steps.tags.outputs.base }}
          subject-digest: ${{ steps.push-lite.outputs.digest }}
          push-to-registry: true

  release:
    name: Publish / Binaries And Draft Release
    runs-on: ubuntu-latest
    needs: [guard, images]
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.guard.outputs.sha }}

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Build Release Binaries
        env:
          VERSION: ${{ needs.guard.outputs.version }}
          BUILT_AT: ${{ needs.guard.outputs.built_at }}
          SHA: ${{ needs.guard.outputs.sha }}
        run: |
          set -euo pipefail
          module=github.com/babywbx/kiln/modules/version
          commit=$(printf '%s' "$SHA" | cut -c1-7)
          ldflags="-s -w -buildid= -X ${module}.Version=${VERSION} -X ${module}.Commit=${commit} -X ${module}.BuiltAt=${BUILT_AT}"
          mkdir -p dist stage

          package() {
            name="$1" goos="$2" goarch="$3" goarm="$4" tags="$5" label="$6"
            binary="$name"
            [ "$goos" = "windows" ] && binary="${name}.exe"
            rm -rf stage && mkdir -p stage
            env CGO_ENABLED=0 GOOS="$goos" GOARCH="$goarch" GOARM="$goarm" \
              go build -tags="$tags" -trimpath -ldflags="$ldflags" -o "stage/${binary}" ./apps/server
            cp LICENSE NOTICE README.md README.en.md stage/
            archive="${name}_${VERSION}_${goos}_${label}"
            if [ "$goos" = "windows" ]; then
              (cd stage && zip -qr "../dist/${archive}.zip" .)
            else
              tar -czf "dist/${archive}.tar.gz" -C stage .
            fi
          }

          package kiln linux   amd64 "" ""     amd64
          package kiln linux   arm64 "" ""     arm64
          package kiln linux   arm   7  ""     armv7
          package kiln linux   arm   6  ""     armv6
          package kiln darwin  amd64 "" ""     amd64
          package kiln darwin  arm64 "" ""     arm64
          package kiln windows amd64 "" ""     amd64
          package kiln windows arm64 "" ""     arm64

          package kiln-lite linux amd64 "" lite amd64
          package kiln-lite linux arm64 "" lite arm64
          package kiln-lite linux arm   7  lite armv7
          package kiln-lite linux arm   6  lite armv6

          rm -rf stage
          (cd dist && sha256sum kiln*.tar.gz kiln*.zip > SHA256SUMS)
          ls -lh dist

      - name: Attest Binary Provenance
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: dist/kiln*.tar.gz,dist/kiln*.zip

      - name: Create Draft Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.guard.outputs.tag }}
          VERSION: ${{ needs.guard.outputs.version }}
          PRERELEASE: ${{ needs.guard.outputs.prerelease }}
        run: |
          set -euo pipefail
          image="${REGISTRY}/$(printf '%s' "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')"
          notes=$(printf '%s\n' \
            "## Container Images" \
            "" \
            '```' \
            "docker pull ${image}:${VERSION}        # full, includes ffmpeg" \
            "docker pull ${image}:${VERSION}-core   # native packager, no ffmpeg" \
            "docker pull ${image}:${VERSION}-lite   # stateless low-memory variant" \
            '```' \
            "" \
            "Verify binaries against \`SHA256SUMS\`.")
          flags=(--draft --title "Kiln ${VERSION}" --notes "$notes")
          [ "$PRERELEASE" = "true" ] && flags+=(--prerelease)
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" "${flags[@]}" dist/*
          fi
