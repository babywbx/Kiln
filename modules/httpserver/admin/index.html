<!doctype html>
<html lang="zh-Hans">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="color-scheme" content="light dark">
  <title>Kiln 控制台</title>
  <link rel="icon" href="/admin/assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/admin/assets/app.css">
  <script type="module" src="/admin/assets/app.js"></script>
</head>
<body>
  <a class="skip-link" href="#main-content">跳到主要内容</a>

  <main class="login-view" id="login-view" aria-labelledby="login-title">
    <div class="login-backdrop" aria-hidden="true"></div>
    <div class="login-panel">
      <div class="brand-lockup">
        <span class="brand-mark" aria-hidden="true"><span></span><span></span><span></span></span>
        <span>Kiln</span>
      </div>
      <div class="login-copy">
        <p class="eyebrow">媒体网关控制台</p>
        <h1 id="login-title">让每一路流，<br>都清楚可控。</h1>
        <p>管理频道、会话、访问链接与出站路由。</p>
      </div>
      <form class="login-form" id="login-form" novalidate>
        <div class="field">
          <label for="login-user">用户名</label>
          <input id="login-user" name="username" autocomplete="username" value="admin" required>
        </div>
        <div class="field">
          <label for="login-password">密码</label>
          <input id="login-password" name="password" type="password" autocomplete="current-password" required>
        </div>
        <label class="check-row" for="remember-login">
          <input id="remember-login" type="checkbox">
          <span>在此设备保持登录</span>
        </label>
        <p class="form-error" id="login-error" role="alert"></p>
        <button class="button button-primary button-wide" type="submit">
          <span>登录控制台</span><span aria-hidden="true">→</span>
        </button>
      </form>
      <p class="login-foot">本页面不会加载外部资源 · <span id="login-version">Kiln</span></p>
    </div>
  </main>

  <div class="app-shell is-hidden" id="app-shell">
    <div class="mobile-scrim" id="mobile-scrim" hidden></div>
    <aside class="sidebar" id="sidebar" aria-label="主导航">
      <div class="sidebar-head">
        <a class="brand-lockup brand-link" href="/admin/overview" data-route>
          <span class="brand-mark" aria-hidden="true"><span></span><span></span><span></span></span>
          <span class="brand-name">Kiln</span>
        </a>
        <button class="icon-button sidebar-collapse" id="sidebar-collapse" type="button" aria-label="收起侧边栏" title="收起侧边栏">‹</button>
      </div>
      <nav class="nav-list">
        <a href="/admin/overview" data-route data-nav="overview"><span class="nav-icon" aria-hidden="true">⌂</span><span>概览</span></a>
        <a href="/admin/channels" data-route data-nav="channels"><span class="nav-icon" aria-hidden="true">◫</span><span>频道</span></a>
        <a href="/admin/access" data-route data-nav="access"><span class="nav-icon" aria-hidden="true">⌁</span><span>访问</span></a>
        <a href="/admin/egress" data-route data-nav="egress"><span class="nav-icon" aria-hidden="true">⇄</span><span>出站</span></a>
        <a href="/admin/settings" data-route data-nav="settings"><span class="nav-icon" aria-hidden="true">⚙</span><span>设置</span></a>
      </nav>
      <div class="sidebar-foot">
        <div class="instance-card">
          <span class="status-dot" id="instance-dot"></span>
          <span><strong id="instance-state">正在连接</strong><small id="instance-detail">检查服务状态</small></span>
        </div>
      </div>
    </aside>

    <div class="app-column">
      <header class="topbar">
        <button class="icon-button mobile-menu" id="mobile-menu" type="button" aria-label="打开导航">☰</button>
        <div class="page-identity">
          <span class="breadcrumb">控制台</span>
          <strong id="page-title">概览</strong>
        </div>
        <button class="command-trigger" id="command-trigger" type="button" aria-label="搜索频道或操作">
          <span aria-hidden="true">⌕</span><span>搜索频道或操作</span><kbd>⌘ K</kbd>
        </button>
        <div class="top-actions">
          <button class="icon-button" id="theme-toggle" type="button" aria-label="切换主题" title="切换主题">◐</button>
          <button class="account-button" id="account-button" type="button" aria-haspopup="menu" aria-expanded="false">
            <span class="avatar" id="account-avatar">A</span><span class="account-copy"><strong id="account-name">admin</strong><small>管理员</small></span><span aria-hidden="true">⌄</span>
          </button>
          <div class="menu is-hidden" id="account-menu" role="menu">
            <button type="button" role="menuitem" id="logout-button">退出登录</button>
          </div>
        </div>
      </header>
      <main id="main-content" tabindex="-1"></main>
    </div>
  </div>

  <dialog class="command-dialog" id="command-dialog" aria-labelledby="command-title">
    <h2 class="sr-only" id="command-title">全局搜索</h2>
    <div class="command-input-wrap"><span aria-hidden="true">⌕</span><input id="command-input" autocomplete="off" placeholder="搜索频道、页面或操作…" aria-controls="command-results"></div>
    <div class="command-results" id="command-results" role="listbox"></div>
    <footer><span><kbd>↑</kbd><kbd>↓</kbd> 选择</span><span><kbd>Enter</kbd> 打开</span><span><kbd>Esc</kbd> 关闭</span></footer>
  </dialog>

  <dialog class="modal" id="modal"><div id="modal-content"></div></dialog>
  <div class="toast-region" id="toast-region" aria-live="polite" aria-atomic="true"></div>
</body>
</html>
